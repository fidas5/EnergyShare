spring.application.name=transaction-service
server.port=${SERVER_PORT:8084}

# --- PostgreSQL ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/transaction_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- RabbitMQ ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# --- Marketplace Service (appel synchrone GET /reservations/{id}) ---
app.marketplace.base-url=${MARKETPLACE_URL:http://localhost:8083/api}
app.marketplace.connect-timeout=2s
app.marketplace.read-timeout=3s

# --- Evenements publies vers RabbitMQ ---
app.events.exchange=energyshare.transactions
app.events.queue=marketplace.transaction-events
app.events.confirmed-key=transaction.confirmed
app.events.cancelled-key=transaction.cancelled
