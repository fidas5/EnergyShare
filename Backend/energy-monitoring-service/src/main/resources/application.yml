server:
  port: 8082

spring:
  application:
    name: energy-monitoring-service

  datasource:
    url: jdbc:postgresql://localhost:5432/energy_monitoring_db
    username: postgres
    password: "root"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info